<style>
  #u3a {
    --tb-bg: light-dark(#f6f8f7, #101817);
    --tb-surface: light-dark(#fff, #182321);
    --tb-fg: light-dark(#18181b, #f4faf8);
    --tb-muted: light-dark(#5f6565, #adbeb8);
    --tb-line: light-dark(#d8e3df, #364a43);
    --tb-primary: light-dark(#1b7e74, #37beac);
    --tb-on: light-dark(#fff, #032621);
    --tb-soft: light-dark(#e7f3ee, #203f38);
    --tb-danger: light-dark(#a62922, #ffb4aa);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 16px 0;
  }
  #u3a * {
    box-sizing: border-box;
  }
  #u3a .tb-app {
    max-width: 390px;
    margin: auto;
    background: var(--tb-bg);
    color: var(--tb-fg);
    border: 1px solid var(--tb-line);
    border-radius: 24px;
    overflow: hidden;
    font-size: calc(16px * var(--tb-scale, 1));
    line-height: 1.5;
  }
  #u3a .tb-top,
  #u3a .tb-tabs,
  #u3a .tb-bottom {
    background: var(--tb-surface);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--tb-line);
  }
  #u3a .tb-top {
    justify-content: space-between;
  }
  #u3a .tb-top small {
    line-height: 1.5;
    font-size: 0.75em;
    color: var(--tb-muted);
  }
  #u3a button,
  #u3a input,
  #u3a select,
  #u3a textarea {
    font: inherit;
    line-height: 1.5;
    min-height: 48px;
    border: 1px solid var(--tb-line);
    border-radius: 12px;
    background: var(--tb-surface);
    color: var(--tb-fg);
    padding: 10px 12px;
    max-width: 100%;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  #u3a button {
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #u3a button svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    vertical-align: middle;
  }
  #u3a .tb-primary {
    background: var(--tb-primary);
    color: var(--tb-on);
    border-color: var(--tb-primary);
  }
  #u3a .tb-quiet {
    border-color: transparent;
    background: transparent;
    color: var(--tb-primary);
  }
  #u3a .tb-tabs button {
    flex: 1;
    font-size: 0.875em;
    border-color: transparent;
    border-radius: 8px;
    padding: 10px 4px;
  }
  #u3a button[aria-current='page'] {
    background: var(--tb-soft);
    color: var(--tb-primary);
    text-decoration: underline;
    text-underline-offset: 6px;
  }
  #u3a .tb-main {
    padding: 16px;
    display: grid;
    gap: 24px;
  }
  #u3a h1,
  #u3a h2,
  #u3a h3,
  #u3a p {
    margin: 0;
  }
  #u3a h1 {
    font-size: 1.5em;
    line-height: 1.33;
    letter-spacing: -0.03em;
  }
  #u3a h2 {
    font-size: 1.25em;
    line-height: 1.4;
  }
  #u3a h3 {
    font-size: 1em;
    line-height: 1.5;
  }
  #u3a .tb-muted {
    color: var(--tb-muted);
    font-size: 0.875em;
  }
  #u3a .tb-stack {
    display: grid;
    gap: 12px;
    min-width: 0;
  }
  #u3a .tb-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  #u3a .tb-card {
    background: var(--tb-surface);
    border: 1px solid var(--tb-line);
    border-radius: 16px;
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  #u3a .tb-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  #u3a .tb-number {
    font-size: 1.5em;
    line-height: 1.33;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  #u3a .tb-hero {
    background: var(--tb-soft);
    border: none;
  }
  #u3a .tb-hero .tb-number {
    font-size: 2em;
  }
  #u3a .tb-group {
    background: var(--tb-surface);
    border: 1px solid var(--tb-line);
    border-radius: 16px;
    overflow: hidden;
  }
  #u3a .tb-group > button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 0;
    border-bottom: 1px solid var(--tb-line);
    padding: 12px 16px;
    min-height: 56px;
  }
  #u3a .tb-group > button:last-child {
    border-bottom: 0;
  }
  #u3a .tb-expense {
    display: grid !important;
    grid-template-columns: 28px minmax(0, 1fr) auto;
    align-items: start !important;
    font-weight: 400 !important;
    gap: 10px !important;
    padding: 12px !important;
  }
  #u3a .tb-expense strong {
    font-weight: 600;
  }
  #u3a .tb-amount {
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #u3a .tb-expense small {
    line-height: 1.5;
    display: block;
    color: var(--tb-muted);
    font-size: 0.875em;
    margin-top: 4px;
    overflow-wrap: anywhere;
  }
  #u3a .tb-date {
    font-size: 0.875em;
    color: var(--tb-muted);
    margin-bottom: 8px;
  }
  #u3a label {
    display: grid;
    gap: 6px;
    font-size: 0.875em;
  }
  #u3a input,
  #u3a select,
  #u3a textarea {
    width: 100%;
    font-size: 1.143em;
    min-width: 0;
  }
  #u3a textarea {
    resize: vertical;
  }
  #u3a .tb-inline {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #u3a .tb-inline input {
    flex: 1;
    min-width: 100px;
    width: 100px;
  }
  #u3a .tb-bottom {
    border-top: 1px solid var(--tb-line);
    border-bottom: 0;
    padding: 8px 8px 20px;
  }
  #u3a .tb-bottom button {
    display: block;
    flex: 1;
    border: none;
    background: transparent;
    font-size: 0.875em;
    padding: 8px 4px;
  }
  #u3a .tb-bottom svg {
    display: block;
    margin: 0 auto 4px;
  }
  #u3a details summary {
    min-height: 48px;
    display: flex;
    align-items: center;
    color: var(--tb-primary);
    font-weight: 600;
  }
  #u3a .tb-warning {
    border-left: 4px solid var(--tb-danger);
    background: var(--tb-surface);
    padding: 12px;
    color: var(--tb-fg);
  }
  #u3a .tb-pill {
    display: inline-block;
    background: var(--tb-soft);
    color: var(--tb-primary);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.75em;
  }
  #u3a .tb-large .tb-metrics {
    grid-template-columns: 1fr;
  }
  #u3a .tb-large .tb-expense {
    grid-template-columns: 28px minmax(0, 1fr);
  }
  #u3a .tb-large .tb-amount {
    grid-column: 2;
    text-align: left;
    white-space: normal;
  }
  #u3a .tb-large .tb-top {
    align-items: flex-start;
  }
  #u3a .tb-large .tb-top small {
    display: none;
  }
  #u3a .tb-large .tb-row {
    align-items: flex-start;
  }
  #u3a .tb-large #tb-search input {
    flex-basis: 100%;
    width: 100%;
  }
  #u3a .tb-large button {
    font-weight: 500;
  }
  #u3a progress {
    width: 100%;
    accent-color: var(--tb-primary);
    height: 8px;
  }
  @media (max-width: 350px) {
    #u3a .tb-metrics {
      grid-template-columns: 1fr;
    }
    #u3a .tb-expense {
      grid-template-columns: 24px minmax(0, 1fr);
    }
    #u3a .tb-amount {
      grid-column: 2;
      text-align: left;
    }
    #u3a .tb-tabs button {
      font-size: 0.875em;
    }
  }
</style>
<div id="u3a" class="viz-dotted-background" aria-label="U3a 六頁目標稿">
  <div class="tb-app" id="u3a-app"></div>
</div>
<script>
  (() => {
    const root = document.getElementById('u3a'),
      app = document.getElementById('u3a-app');
    const settings = { theme: 'auto', large: false, page: 'expenses', state: 'normal' };
    let detailFx = false,
      mode = '均分',
      preview = false,
      filters = false,
      analysis = false,
      query = '',
      applied = '',
      menu = false;
    const title = 'TEST U3A 多人帳務與長旅行名稱：台北與東京跨城市旅程';
    const longName = 'TEST 虛擬成員與非常長的顯示名稱用來核對換行與身分辨識';
    const names = ['TEST 同名 · #a7403e · 本人', 'TEST 同名 · #a7403f', longName + ' · 虛擬成員'];
    const icon = (n) => `<i data-lucide="${n}" aria-hidden="true"></i>`;
    const btn = (label, page, cls = 'tb-quiet') =>
      `<button type="button" class="${cls} cursor-interaction" data-page="${page}" ${page === 'menu' ? 'aria-label="開啟導覽"' : ''}>${label}</button>`;
    const item = (label, page, sub = '') =>
      btn(
        `<span>${label}${sub ? `<small class="tb-muted" style="display:block">${sub}</small>` : ''}</span>${icon('chevron-right')}`,
        page,
        ''
      );
    const fmt = (x) => 'NT$' + x;
    const data = [
      {
        description: 'TEST 日圓既有支出',
        payer: names[2],
        amount: '99.9',
        sub: 'JPY ¥3,000',
        icon: 'train-front',
      },
      {
        description: 'TEST 長說明晚餐與交通費用：多人同名成員及到分的非均分',
        payer: names[0],
        amount: '100.01',
        sub: '',
        icon: 'utensils',
      },
    ];
    const pages = {
      trips: '旅行',
      overview: '旅行概覽',
      expenses: '支出',
      new: '新增支出',
      settlement: '結算',
      me: '我的',
      budget: '我的預算',
      detail: '支出明細',
      receipts: '收據附件',
      local: '本機工作',
      preferences: '語言與外觀',
      manage: '旅行管理',
    };
    const escape = (s) =>
      s.replace(
        /[&<>"']/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
      );
    function expenseRows() {
      return (
        data
          .filter((x) => !applied || (x.description + x.payer).includes(applied))
          .map((x) =>
            btn(
              `${icon(x.icon)}<span><strong>${x.description}</strong><small>${x.payer}</small></span><span class="tb-amount"><strong>${fmt(x.amount)}</strong>${x.sub ? `<small>${x.sub}</small>` : ''}</span>`,
              'detail',
              'tb-expense'
            ).replace('data-page=', 'data-fx="' + (x.sub ? 'yes' : 'no') + '" data-page=')
          )
          .join('') || '<p style="padding:16px">沒有符合條件的支出</p>'
      );
    }
    function stateBlock() {
      if (settings.state === 'offline')
        return '<div class="tb-warning" role="status">目前離線，顯示已讀取資料。新輸入可先存草稿。</div>';
      if (settings.state === 'pending')
        return `<div class="tb-warning" role="status">有一筆結果待確認，請先查詢原紀錄。${btn('查看待確認紀錄', 'local')}</div>`;
      return '';
    }
    function body() {
      switch (settings.page) {
        case 'trips':
          return `<div class="tb-row"><h1>旅行</h1><div>${btn('建立', 'manage')}${btn('加入', 'manage')}</div></div>${btn('本機草稿 1 筆 · 查看', 'local')}<article class="tb-card"><span class="tb-pill">旅行中 · 3 位成員</span><h2>${title}</h2><p class="tb-muted">2026/10/10 – 10/12 · TWD</p><div class="tb-metrics"><div><p class="tb-muted">本人分攤</p><p class="tb-number">NT$43.3</p></div><div><p class="tb-muted">應收</p><p class="tb-number">NT$36.21</p></div></div>${btn('開啟旅行', 'overview', 'tb-primary')}</article>`;
        case 'overview':
          return `<div class="tb-stack"><span class="tb-muted">旅行中 · 10/10 – 10/12 · 3 位成員</span><h1>${title}</h1></div><section class="tb-card"><div class="tb-metrics"><div><p class="tb-muted">本人分攤</p><p class="tb-number">NT$43.3</p></div><div><p class="tb-muted">應收</p><p class="tb-number">NT$36.21</p></div></div>${btn('記一筆', 'new', 'tb-primary')}</section><div class="tb-group">${item('我的預算', 'budget', '剩餘 NT$956.7 · 僅本人可見')}${item('旅行管理', 'manage', '設定、成員與邀請')}</div><details><summary>旅行資料</summary><p>總支出 NT$199.91 · 2 筆</p><p>目的地：Taipei</p></details>`;
        case 'expenses':
          return `<div class="tb-row"><h1>支出</h1>${btn(`${icon('plus')} 記一筆`, 'new', 'tb-primary')}</div><div class="tb-stack"><form id="tb-search" class="tb-inline"><input aria-label="搜尋說明或付款人" placeholder="搜尋說明或付款人" value="${escape(query)}"><button type="button" data-action="search" aria-label="套用搜尋" class="tb-quiet">${icon('search')}</button><button type="button" data-action="filters" aria-expanded="${filters}">${icon('sliders-horizontal')} 篩選</button></form>${filters ? '<div class="tb-card"><label>分類<select><option>全部</option><option>餐飲</option><option>交通</option></select></label><label>付款人<select><option>全部成員</option><option>TEST 同名 · #a7403e</option></select></label><label>開始日期<input type="date"></label><label>結束日期<input type="date"></label><p class="tb-muted">條件配置示意；此原型僅示範關鍵字套用。</p></div>' : ''}<div class="tb-row"><span class="tb-muted">${applied ? '已套用：' + escape(applied) : '最新在前 · TWD'}</span><button class="tb-quiet" data-action="analysis" aria-expanded="${analysis}">${icon('chart-no-axes-combined')} 分析</button></div>${analysis ? '<section class="tb-card"><h2>分析</h2><p>原型僅展示分析入口。產品顯示相同條件、相同快照的筆數、總額與本人分攤。</p></section>' : ''}</div>${settings.state === 'empty' ? '<section class="tb-card"><h2>還沒有支出</h2><p>從第一筆共同花費開始。</p></section>' : `<section><p class="tb-date">2026/10/10</p><div class="tb-group">${expenseRows()}</div></section>`}`;
        case 'new':
          return `<div class="tb-row"><h1>新增支出</h1><span class="tb-muted">草稿已保存</span></div><section class="tb-stack"><label>金額<input inputmode="decimal" value="100.01" aria-label="金額"></label><label>幣別<select><option>TWD 新台幣</option><option>JPY 日圓</option></select></label><label>說明<textarea rows="2">TEST 晚餐</textarea></label><div class="tb-metrics"><label>日期<input type="date" value="2026-10-10"></label><label>分類<select><option>餐飲</option><option>交通</option></select></label></div></section><section class="tb-stack"><h2>付款與分攤</h2><label>付款人<select>${names.map((n) => `<option>${n}</option>`).join('')}</select></label><label>分攤方式<select id="tb-mode">${['均分', '固定金額', '百分比', '份數'].map((m) => `<option ${m === mode ? 'selected' : ''}>${m}</option>`).join('')}</select></label><details ${mode === '均分' ? '' : 'open'}><summary>參與成員 · 3 人</summary><div class="tb-stack">${names.map((n, i) => `<div class="tb-card"><span>${n}</span>${mode === '均分' ? '<span class="tb-muted">參與分攤</span>' : `<label>${mode === '固定金額' ? 'TWD' : mode === '百分比' ? '百分比 %' : '份數'}<input inputmode="decimal" value="${mode === '固定金額' ? [10, 80.01, 10][i] : mode === '百分比' ? [10, 80, 10][i] : [1, 8, 1][i]}"></label>`}</div>`).join('')}</div></details><p class="tb-muted">${mode === '均分' ? '離線時可先保存草稿。' : '進階分攤離線只保存草稿；連線後預覽確認。'}</p><button class="tb-primary" data-action="preview">預覽分攤</button>${preview ? `<section class="tb-card"><h2>核對分攤</h2><p>TWD 100.01 · ${mode}</p>${names.map((n, i) => `<p>${n}<br><strong>NT$${mode === '均分' ? [33.34, 33.34, 33.33][i] : [10, 80.01, 10][i]}</strong></p>`).join('')}<p class="tb-muted">設計示例，未呼叫後端或入帳。</p><button data-action="close-preview">返回修改</button></section>` : ''}</section>`;
        case 'settlement':
          return `<h1>結算</h1><section class="tb-card tb-hero"><p>本人應收</p><p class="tb-number">NT$36.21</p><p class="tb-muted">尚有未結清款項</p></section><section class="tb-stack"><h2>與我相關的建議</h2><div class="tb-card"><p>TEST 同名 · #a7403f → 本人</p><p class="tb-number">NT$36.21</p><p class="tb-muted">建議轉帳，尚未支付</p>${btn('登記已付款', 'manage', 'tb-primary')}</div></section><details><summary>其他建議 · 1 筆</summary><p>TEST 同名 · #a7403f → ${longName}</p><p>NT$56.6 · 尚未支付</p></details>${btn('手動登記還款', 'manage')}<section class="tb-stack"><h2>已登記還款</h2><div class="tb-card"><p>TEST 同名 · #a7403f → 本人</p><strong>NT$20.5</strong><p class="tb-muted">2026/10/10 · 部分現金還款</p></div></section><details><summary>成員餘額 · 3 人</summary><p>本人應收 NT$36.21</p><p>TEST 同名 · #a7403f 應付 NT$92.81</p><p>${longName} 應收 NT$56.6</p></details>`;
        case 'me':
          return `<h1>我的</h1><section class="tb-card"><h2>TEST 同名</h2><p class="tb-muted">@u3a-base</p></section><section class="tb-stack"><h2>偏好與關於</h2><div class="tb-group">${item('語言與外觀', 'preferences', '繁體中文 · 跟隨系統')}${item('關於', 'preferences')}</div></section><section class="tb-stack"><h2>本機工作</h2><div class="tb-group">${item('草稿與待處理', 'local', '1 筆草稿')}</div></section><button class="tb-quiet" data-action="logout">登出</button>`;
        case 'budget':
          return `<h1>我的預算</h1><p class="tb-muted">僅本人可見 · TWD</p><section class="tb-card"><p>剩餘預算</p><p class="tb-number">NT$956.7</p><progress value="43.3" max="1000" aria-label="已用預算"></progress><p class="tb-muted">本人分攤 NT$43.3／預算 NT$1,000</p></section><div class="tb-group">${item('餐飲 · 剩餘 NT$490', 'budget', '已用 NT$10／預算 NT$500')}${item('交通 · 未設限額', 'budget', '本人分攤 NT$33.3')}</div><details><summary>編輯預算</summary><label>總預算 TWD<input value="1000"></label><p class="tb-muted">保存前需核對變更。</p></details>`;
        case 'detail':
          if (detailFx)
            return `<h1>TEST 日圓既有支出</h1><p class="tb-number">NT$99.9</p><p>JPY ¥3,000 · 匯率 0.0333</p><p class="tb-muted">2026/10/10 · 交通</p><p>${names[2]} 付款</p><section class="tb-card"><h2>分攤明細</h2>${names.map((n) => `<p>${n}<br>NT$33.3</p>`).join('')}</section>${btn('收據附件', 'receipts')}`;
          return `<h1>TEST 長說明晚餐與交通費用：多人同名成員及到分的非均分</h1><p class="tb-number">NT$100.01</p><p class="tb-muted">2026/10/10 · 餐飲</p><p>${names[0]} 付款</p><section class="tb-card"><h2>分攤明細</h2>${names.map((n, i) => `<p>${n}<br>NT$${[10, 80.01, 10][i]}</p>`).join('')}</section><div class="tb-group">${item('收據附件', 'receipts', '僅旅行成員可讀')}${item('編輯支出', 'new', '基本修改保留歷史份額')}</div>`;
        case 'receipts':
          return '<h1>收據附件</h1><section class="tb-card"><h2>尚無收據</h2><p>新增圖片或 PDF，方便核對。</p><button data-action="receipt">管理收據</button></section><details><summary>附件與隱私</summary><p>PDF 由外部瀏覽器開啟，下載檔案可能留存；連結到期後需重新開啟。</p></details>';
        case 'local':
          return (
            '<h1>本機工作</h1><div class="tb-warning">結果待確認時，保留原紀錄並查詢結果，不建立新請求。</div><div class="tb-group">' +
            item('晚餐 · NT$100.01', 'new', '草稿 · 尚未入帳') +
            '</div>'
          );
        case 'preferences':
          return (
            '<h1>語言與外觀</h1><label>外觀<select id="tb-theme"><option value="auto">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select></label><label><input id="tb-large" type="checkbox" ' +
            (settings.large ? 'checked' : '') +
            '>大字級設計檢視</label><p class="tb-muted">此處只調整目標稿，不變更裝置設定。</p>'
          );
        default:
          return (
            '<h1>' +
            pages[settings.page] +
            '</h1><p>此入口延用既有流程與權限。</p>' +
            btn('返回概覽', 'overview')
          );
      }
    }
    function render() {
      root.style.colorScheme = settings.theme === 'auto' ? 'light dark' : settings.theme;
      app.classList.toggle('tb-large', settings.large);
      app.style.setProperty('--tb-scale', settings.large ? '2' : '1');
      const trip = ['overview', 'expenses', 'settlement'].includes(settings.page);
      const nav = Object.keys(pages)
        .slice(0, 6)
        .map((p) => btn(pages[p], p))
        .join('');
      app.innerHTML = `<header class="tb-top">${btn(icon('chevron-left') + (settings.large ? '返回' : ' ' + (trip ? '旅行' : settings.page === 'trips' ? 'Travel Budget' : '返回')), trip ? 'trips' : settings.page === 'detail' ? 'expenses' : settings.page === 'receipts' ? 'detail' : 'overview')}<small>U3a · 目標稿</small>${btn(icon('menu'), 'menu')}</header>${menu ? `<nav class="tb-card" aria-label="頁面導覽"><p>${title}</p>${nav}</nav>` : ''}${trip ? (settings.large ? `<nav class="tb-tabs"><button data-action="trip-menu">${pages[settings.page]} ${icon('chevron-down')}</button></nav>` : `<nav class="tb-tabs">${['overview', 'expenses', 'settlement'].map((p) => `<button data-page="${p}" aria-current="${p === settings.page ? 'page' : 'false'}">${pages[p]}</button>`).join('')}</nav>`) : ''}<main class="tb-main">${stateBlock()}${settings.state === 'denied' ? '<div class="tb-warning" role="alert">無法開啟這趟旅行，或你已不再是成員。</div>' + btn('返回旅行', 'trips') : body()}</main>${!settings.large && ['trips', 'overview', 'expenses', 'settlement', 'me'].includes(settings.page) ? `<nav class="tb-bottom" aria-label="主要導覽">${btn(icon('map-pin') + '旅行', 'trips')}${btn(icon('plus') + '記一筆', 'new')}${btn(icon('user-round') + '我的', 'me')}</nav>` : ''}`;
      app.querySelectorAll('[data-page]').forEach(
        (b) =>
          (b.onclick = () => {
            if (b.dataset.page === 'menu') {
              menu = !menu;
            } else {
              detailFx = b.dataset.fx === 'yes';
              settings.page = b.dataset.page;
              menu = false;
              preview = false;
            }
            render();
            save();
          })
      );
      app.querySelectorAll('[data-action]').forEach(
        (b) =>
          (b.onclick = () => {
            const a = b.dataset.action;
            if (a === 'search') {
              query = app.querySelector('#tb-search input').value;
              applied = query;
              analysis = false;
            }
            if (a === 'filters') filters = !filters;
            if (a === 'analysis') analysis = !analysis;
            if (a === 'preview') preview = true;
            if (a === 'close-preview') preview = false;
            if (a === 'trip-menu') menu = !menu;
            if (a === 'logout' || a === 'receipt') {
              b.insertAdjacentHTML(
                'afterend',
                '<p role="status" class="tb-muted">目標稿僅示範入口，未執行操作。</p>'
              );
              return;
            }
            render();
            save();
          })
      );
      const f = app.querySelector('#tb-search');
      if (f) {
        f.querySelector('input').oninput = (e) => (query = e.target.value);
        f.onsubmit = (e) => {
          e.preventDefault();
          applied = query;
          analysis = false;
          render();
          save();
        };
      }
      const m = app.querySelector('#tb-mode');
      if (m)
        m.onchange = () => {
          mode = m.value;
          preview = false;
          render();
        };
      const t = app.querySelector('#tb-theme');
      if (t) {
        t.value = settings.theme;
        t.onchange = () => {
          settings.theme = t.value;
          render();
          save();
        };
      }
      const l = app.querySelector('#tb-large');
      if (l)
        l.onchange = () => {
          settings.large = l.checked;
          render();
          save();
        };
      if (typeof lucide !== 'undefined') lucide.createIcons({ attrs: { width: 20, height: 20 } });
    }
    function save() {
      if (window.openai?.setWidgetState)
        window.openai
          .setWidgetState({
            modelContent: { u3aPage: settings.page, theme: settings.theme, large: settings.large },
            privateContent: { settings: { ...settings } },
          })
          .catch(() => {});
    }
    function restore(s) {
      if (s?.privateContent?.settings) {
        const x = s.privateContent.settings;
        if (pages[x.page]) settings.page = x.page;
        if (['auto', 'light', 'dark'].includes(x.theme)) settings.theme = x.theme;
        settings.large = x.large === true;
      }
    }
    restore(window.openai?.widgetState);
    render();
    window.addEventListener('openai:set_globals', (e) => {
      restore(e.detail?.globals?.widgetState);
      render();
    });
    if (globalThis.Tweak) {
      const t = new Tweak({
        container: root,
        onChange: () => {
          render();
          save();
        },
      });
      t.addSelect(settings, 'page', {
        label: '頁面',
        options: Object.entries(pages)
          .slice(0, 6)
          .map(([value, label]) => ({ value, label })),
      });
      t.addSelect(settings, 'theme', {
        label: '外觀',
        options: [
          { value: 'auto', label: '跟隨系統' },
          { value: 'light', label: '淺色' },
          { value: 'dark', label: '深色' },
        ],
      });
      t.addToggle(settings, 'large', { label: '大字級 2×' });
      t.addSelect(settings, 'state', {
        label: '狀態設計',
        options: [
          { value: 'normal', label: '正常' },
          { value: 'empty', label: '支出空白' },
          { value: 'offline', label: '離線' },
          { value: 'pending', label: '待確認' },
          { value: 'denied', label: '撤權' },
        ],
      });
    }
  })();
</script>
