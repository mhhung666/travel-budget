appId: ${MAESTRO_APP_ID}
---
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 30000
# Tap near the field end: a center tap can put Android's caret before the last
# characters, leaving a suffix behind when eraseText sends backspaces.
- tapOn:
    id: login-username
    point: '95%,50%'
- eraseText
- inputText: ${USERNAME}
- tapOn:
    id: login-password
    point: '95%,50%'
- eraseText
- inputText: ${MAESTRO_PASSWORD}
- scrollUntilVisible:
    element:
      id: login-submit
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: TEST ${USERNAME}
    timeout: 30000
