appId: ${MAESTRO_APP_ID}
---
- stopApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: false
          stopApp: false
- openLink: ${MAESTRO_EXPO_URL}
- extendedWaitUntil:
    visible: '${MAESTRO_SUBTITLE}|TEST mobile-writer'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: login-username
    file: entry-login.yaml
    env:
      USERNAME: mobile-writer
- runFlow: entry-open.yaml
