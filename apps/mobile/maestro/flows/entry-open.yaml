appId: ${MAESTRO_APP_ID}
---
# From the trip list of a signed-in writer: open the Writer trip and its add-expense screen. The
# screen shows either the form or, while an earlier request is unconfirmed, that request.
- runFlow:
    when:
      true: ${MAESTRO_DIRECT_DRAFT_FORM === 'true'}
    commands:
      # This D matrix measures the real form, not trip-card navigation; see LOCAL_ACCEPTANCE.
      - openLink: ${MAESTRO_EXPO_URL + '/--/trips/' + MAESTRO_WRITER_TRIP + '/expenses/new'}
- runFlow:
    when:
      true: ${MAESTRO_DIRECT_DRAFT_FORM !== 'true'}
    commands:
      - scrollUntilVisible:
          element:
            id: trip-${MAESTRO_WRITER_TRIP}
          timeout: 60000
          visibilityPercentage: 30
      - tapOn:
          id: trip-${MAESTRO_WRITER_TRIP}
          point: '50%,10%'
      - scrollUntilVisible:
          element:
            id: trip-add-expense
          timeout: 60000
          centerElement: true
      - tapOn:
          id: trip-add-expense
# Large text pushes the form below the first screen: scroll to it rather than wait for it to appear.
- scrollUntilVisible:
    element:
      id: 'new-expense-description|pending-card-0|draft-discard'
    visibilityPercentage: 30
    timeout: 60000
# C regression flows start with a fresh raw form; durable pending requests remain untouched.
- runFlow:
    when:
      visible:
        id: draft-discard
    commands:
      - tapOn:
          id: draft-discard
      - scrollUntilVisible:
          element:
            id: new-expense-description
          timeout: 30000
