appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: flows/queue-create-offline.yaml
    env:
      DESCRIPTION: TEST D3 credential failure
- runScript:
    file: sql-gate-command.js
    env:
      COMMAND: arm-credential-set
- runScript:
    file: network-command.js
    env:
      COMMAND: online-post-401
- scrollUntilVisible:
    element:
      id: queue-sync
    direction: UP
- tapOn:
    id: queue-sync
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 30000
- runScript:
    file: sql-gate-command.js
    env:
      COMMAND: wait-credential-set
- runScript:
    file: network-command.js
    env:
      COMMAND: sqlite-checkpoint-auth-failed
- runFlow:
    file: flows/entry-expect.yaml
    env:
      EXPECT_EXPENSES: '0'
      EXPECT_RECEIPTS: '0'
- runFlow:
    file: flows/entry-login.yaml
    env:
      USERNAME: mobile-writer
- openLink: ${MAESTRO_EXPO_URL + '/--/queue'}
- extendedWaitUntil:
    visible: ${MAESTRO_QUEUE_EMPTY}
    timeout: 120000
- runScript:
    file: network-command.js
    env:
      COMMAND: sqlite-checkpoint-auth-recovered
- takeScreenshot: original-request-after-credential-failure-and-login
