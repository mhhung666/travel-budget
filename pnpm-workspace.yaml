packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Keep React ambient declarations consistent while app runtime versions stay independent.
overrides:
  '@types/react': 19.2.17

# Published packages omit these runtime/type dependency edges.
packageExtensions:
  '@react-pdf/renderer@4.9.0':
    dependencies:
      '@types/react': 19.2.17
  'next-themes@0.4.6':
    dependencies:
      '@types/react': 19.2.17
  'cmdk@1.1.1':
    dependencies:
      '@types/react': 19.2.17
  '@testing-library/jest-dom@6.9.1':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true
  'react-leaflet@5.0.0':
    dependencies:
      '@types/react': 19.2.17
      '@types/leaflet': 1.9.21
      '@types/geojson': 7946.0.16
  '@react-leaflet/core@3.0.0':
    dependencies:
      '@types/react': 19.2.17
      '@types/leaflet': 1.9.21
      '@types/geojson': 7946.0.16

# Resolve native packages for local development and Linux CI/deployments.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64, x64]
  libc: [glibc, musl]
