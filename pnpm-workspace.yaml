packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.32 || 57.0.33'
  - '@expo/config-plugins@57.0.11 || 57.0.12'
  - '@expo/router-server@57.0.14 || 57.0.15'
  - 'expo-modules-core@57.0.24 || 57.0.25'
  - 'expo-modules-jsi@57.1.3'
  - 'expo@57.0.31 || 57.0.32'
  - '@expo/ui@57.0.26'
  - 'expo-network@57.0.3'
  - 'expo-router@57.0.29 || 57.0.30'
  - '@expo/config@57.0.11'
  - '@expo/env@2.4.4'
  - '@expo/fingerprint@0.20.15'
  - '@expo/image-utils@0.11.7'
  - '@expo/inline-modules@0.1.9'
  - '@expo/local-build-cache-provider@57.0.10'
  - '@expo/log-box@57.0.5'
  - '@expo/metro-config@57.0.14'
  - '@expo/plist@0.8.2'
  - '@expo/prebuild-config@57.0.20'
  - '@expo/require-utils@57.0.7'
  - '@expo/schema-utils@57.0.3'
  - 'babel-preset-expo@57.0.17'
  - 'expo-asset@57.0.21'
  - 'expo-constants@57.0.23'
  - 'expo-modules-autolinking@57.0.17'
  - 'expo-glass-effect@57.0.5'
  - 'expo-image-manipulator@57.0.22'
  - 'expo-image-picker@57.0.21'
  - 'expo-splash-screen@57.0.11'

# Keep React ambient declarations consistent while app runtime versions stay independent.
overrides:
  '@types/react': 19.2.17

# Published packages omit these runtime/type dependency edges.
packageExtensions:
  '@react-pdf/renderer@4.9.0':
    dependencies:
      '@types/react': 19.2.17
  'next-themes@0.4.6':
    dependencies:
      '@types/react': 19.2.17
  'cmdk@1.1.1':
    dependencies:
      '@types/react': 19.2.17
  '@testing-library/jest-dom@6.9.1':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true
  'react-leaflet@5.0.0':
    dependencies:
      '@types/react': 19.2.17
      '@types/leaflet': 1.9.21
      '@types/geojson': 7946.0.16
  '@react-leaflet/core@3.0.0':
    dependencies:
      '@types/react': 19.2.17
      '@types/leaflet': 1.9.21
      '@types/geojson': 7946.0.16

# Resolve native packages for local development and Linux CI/deployments.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64, x64]
  libc: [glibc, musl]
