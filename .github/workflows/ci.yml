name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money-aggregation:
    name: Money consistency (real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Isolated service, fresh UUID database; no secrets or production connection.
      # Keep these env vars scoped here: other opt-in DB suites have separate contracts.
      - name: Verify rounding, allocation and actual readers
        run: pnpm exec vitest run src/__tests__/moneyAggregation.integration.test.ts
        env:
          MONGODB_QUEUE_TEST_URI: mongodb://127.0.0.1:27017
          MONGODB_QUEUE_TEST_ALLOW_WRITES: '1'

  verify:
    name: Lint, format, test, build
    runs-on: ubuntu-latest

    # Build-time only. next build does not connect to the DB (all routes are
    # dynamic / server-rendered on demand), but env validation (src/lib/env.ts)
    # requires these to be present and JWT_SECRET to be >= 32 chars.
    env:
      MONGODB_URI: mongodb://localhost:27017/ci
      JWT_SECRET: ci_dummy_secret_at_least_32_characters_long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build
