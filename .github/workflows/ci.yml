name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money-aggregation:
    name: Money consistency (real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Isolated service, fresh UUID database; no secrets or production connection.
      # Keep these env vars scoped here: other opt-in DB suites have separate contracts.
      - name: Verify rounding, allocation, actual readers, mobile read APIs and money migration
        run: pnpm --filter @travel-budget/web exec vitest run src/__tests__/moneyAggregation.integration.test.ts src/__tests__/mobileReadApi.integration.test.ts src/__tests__/expenseMoneyMigration.integration.test.mjs
        env:
          MONGODB_QUEUE_TEST_URI: mongodb://127.0.0.1:27017
          MONGODB_QUEUE_TEST_ALLOW_WRITES: '1'

  photo-uploads:
    name: Photo uploads (MongoDB transactions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated replica set
        run: |
          docker run -d --name photo-test-mongo -p 127.0.0.1:27017:27017 mongo:8.2.6 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec photo-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec photo-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - name: Verify retries, deduplication and cleanup races
        run: pnpm --filter @travel-budget/web exec vitest run src/__tests__/photoUploadJobs.integration.test.ts src/__tests__/photoAudit.test.mjs
        env:
          PHOTO_UPLOAD_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0
      - if: always()
        run: docker rm -f photo-test-mongo

  expense-writes:
    name: Expense creation and idempotency (MongoDB transactions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated replica set
        run: |
          docker run -d --name expense-test-mongo -p 127.0.0.1:27017:27017 mongo:8.2.6 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec expense-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec expense-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      # Shared Web/mobile creation service: atomic receipt, concurrent duplicates, replay after
      # deletion or member removal, rollback, plus the existing trip-writer transactions.
      - name: Verify expense creation, idempotent replay and rollback
        run: pnpm --filter @travel-budget/web exec vitest run src/__tests__/mobileExpenseWrite.integration.test.ts src/__tests__/tripWriters.integration.test.ts src/__tests__/tripEntry.integration.test.ts src/__tests__/accountEntry.integration.test.ts src/__tests__/expenseMaintenance.integration.test.ts
        env:
          MONGODB_MEMBER_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
          MONGODB_MEMBER_TEST_ALLOW_WRITES: '1'
      - if: always()
        run: docker rm -f expense-test-mongo

  verify:
    name: Lint, format, test, build
    runs-on: ubuntu-latest

    # Build-time only. next build does not connect to the DB (all routes are
    # dynamic / server-rendered on demand), but env validation (src/lib/env.ts)
    # requires these to be present and JWT_SECRET to be >= 32 chars.
    env:
      MONGODB_URI: mongodb://localhost:27017/ci
      JWT_SECRET: ci_dummy_secret_at_least_32_characters_long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared contract artifact
        run: pnpm contracts:check

      - name: Check workspace types
        run: pnpm typecheck

      - name: Check workspace formatting
        run: pnpm exec prettier --check package.json pnpm-workspace.yaml .github docs README.md AGENTS.md CLAUDE.md packages

      - name: Lint
        run: pnpm --filter @travel-budget/web lint

      - name: Check formatting
        run: pnpm --filter @travel-budget/web format:check

      - name: Test
        run: pnpm --filter @travel-budget/web test:run

      - name: Build
        run: pnpm --filter @travel-budget/web build

  mobile:
    name: Mobile types, lint, tests and platform bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter travel-budget-mobile check
      - run: pnpm --filter travel-budget-mobile test
      - run: pnpm --filter travel-budget-mobile exec expo install --check
      - run: pnpm export:check
